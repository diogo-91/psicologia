<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Psicologia aplicada</title>
<meta name="theme-color" content="#1d2bd8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  estudo pessoal, calmo, sem ruído
   IDEA   caderno de estudo anotado: coluna de leitura com anotações na margem
   PICTURE trilha do curso: 10 estações ligadas por uma linha que se preenche com o progresso
   COLOUR branco, tinta quase preta, ultramar #1d2bd8, cinza frio; noite #0d0e18
   TYPE   Spectral (títulos) + Inter (texto)
   LAYOUT laptop: leitura + margem fixa (áudio e notas); celular: tudo em uma coluna, notas numa gaveta inferior */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d0e18);--ink:light-dark(#14110f,#ecebf5);--muted:light-dark(#5d6170,#a3a6b8);--line:light-dark(#e3e4ea,#262838);--soft:light-dark(#f2f3fb,#161829);--accent:light-dark(#1d2bd8,#8f98ff);--on-accent:light-dark(#ffffff,#0d0e18);--ok:light-dark(#0b7a52,#5fd3a3);--warn:light-dark(#a33a12,#ff9b73)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(32px,5vw,48px);line-height:1.08;text-wrap:balance}
h2{font-size:25px;line-height:1.2;margin:44px 0 12px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px max(16px,4vw);padding-top:max(10px,env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font:600 18px/1.2 Spectral,Georgia,serif;text-decoration:none;color:var(--ink);margin-right:auto}
.status{font-size:13px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--warn)}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(16px,4vw) 120px}
.hero{padding:40px 0 8px}
.hero p{color:var(--muted);max-width:60ch;margin:12px 0 0}
.map{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));position:relative}
.map::before,.map::after{content:"";position:absolute;top:27px;left:5%;height:3px;background:var(--line);width:90%}
.map::after{background:var(--accent);width:calc(90% * var(--p));transition:width .6s}
.map li{position:relative;text-align:center}
.map a{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--ink);padding:0 4px 8px}
.dot{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:600 20px Spectral,Georgia,serif;background:var(--bg);border:3px solid var(--line);position:relative}
.map .done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.map .here .dot{border-color:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 18%,transparent)}
.map small{font-size:13px;line-height:1.3;color:var(--muted)}
.map .here small{color:var(--ink);font-weight:600}
.count{margin-top:20px;font-size:15px;color:var(--muted)}
.resume{margin:28px 0 8px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;padding:22px 24px;border-radius:16px;background:var(--soft)}
.resume div{flex:1 1 280px}
.resume b{display:block;font:600 22px/1.25 Spectral,Georgia,serif}
.resume span{color:var(--muted);font-size:15px}
.layout{display:grid;gap:40px}
@media(min-width:1080px){.layout.with-aside{grid-template-columns:minmax(0,1fr) 340px}.aside{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}.fab,.sheet-close{display:none}}
.read{max-width:72ch}
.label{font-size:14px;font-weight:600;color:var(--accent);margin:36px 0 8px}
.audio{margin:24px 0 8px;padding:16px;border-radius:14px;background:var(--soft)}
.audio audio{width:100%;display:block}
.audio .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--muted)}
.audio .row .btn[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.audio .none{margin:0;font-size:15px;color:var(--muted)}
.toc{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;margin:0 0 4px;scrollbar-width:thin}
.toc a{flex:none;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
.toc a.on{border-color:var(--accent);color:var(--accent)}
.read p{margin:0 0 14px}
.read ul,.read ol{margin:0 0 16px;padding-left:24px}
.read li{margin:0 0 8px}
.read li.l2{margin-left:22px;list-style:circle}
.callout{margin:16px 0;padding:16px 18px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 12px 12px 0}
.scroll{overflow-x:auto;margin:8px 0 20px}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45}
th{text-align:left;background:var(--accent);color:var(--on-accent);font-weight:600}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.task{border:1px solid var(--line);border-radius:14px;padding:6px 18px 18px;margin:0 0 16px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-of-type{border-bottom:0}
.check input{width:22px;height:22px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.q{margin:0 0 22px}
.q p{margin:0 0 8px;font-weight:600}
label.f{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
textarea{display:block;width:100%;min-height:110px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.endbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:48px 0 0;padding-top:24px;border-top:1px solid var(--line)}
.endbar .nav{display:flex;gap:10px;flex-wrap:wrap}
.aside h3{font-size:21px;margin:0 0 4px}
.aside p{font-size:14px;color:var(--muted);margin:0 0 10px}
.aside textarea{min-height:320px}
.fab{position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media(max-width:1079px){.aside{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:18px max(16px,4vw) max(18px,env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility 0s .25s;box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:80svh;overflow:auto}.aside.open{transform:none;visibility:visible;transition:transform .25s}.aside textarea{min-height:40svh}.sheet-close{float:right}}
.login{max-width:420px;margin:12vh auto 0;padding:0 16px}
.login p{color:var(--muted)}
.login input{display:block;width:100%;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:16px;margin:0 0 12px}
.login .msg{min-height:24px;font-size:15px}
.login .row{display:flex;gap:10px;flex-wrap:wrap}
.hidden{display:none!important}
@media(max-width:900px){.map{grid-template-columns:repeat(5,minmax(0,1fr));row-gap:18px}.map::before,.map::after{display:none}}
@media(max-width:700px){.dot{width:48px;height:48px;font-size:18px}h2{font-size:22px;margin-top:36px}body{font-size:16px}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{border:0;padding:3px 0}.stack td::before{content:attr(data-l);display:block;font-size:13px;font-weight:600;color:var(--muted)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#inicio">Psicologia aplicada</a>
  <span class="status" id="status" aria-live="polite"></span>
  <button class="btn small hidden" id="sair" type="button">Sair</button>
</header>

<section class="login hidden" id="login">
  <h1>Entrar</h1>
  <p>Seu progresso, respostas e anotações ficam salvos no servidor.</p>
  <form id="loginForm">
    <input type="text" name="username" value="estudo" autocomplete="username" hidden>
    <input id="senha" type="password" autocomplete="current-password" placeholder="Senha" required>
    <div class="row">
      <button class="btn primary" type="submit">Entrar</button>
    </div>
  </form>
  <p class="msg" id="loginMsg" role="status"></p>
</section>

<main class="wrap hidden" id="app">
  <div class="layout" id="layout">
    <div id="view"></div>
    <aside class="aside hidden" id="aside" aria-label="Anotações do módulo">
      <button class="btn small sheet-close" type="button" id="fechar">Fechar</button>
      <h3>Anotações</h3>
      <p>Escreva o que quiser sobre este módulo. Salva sozinho.</p>
      <textarea id="notas" aria-label="Anotações do módulo"></textarea>
    </aside>
  </div>
</main>
<button class="btn primary fab hidden" id="fab" type="button">Anotações</button>

<script src="app.js"></script>
</body>
</html>
